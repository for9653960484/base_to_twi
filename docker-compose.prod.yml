# Прод: образы из GHCR. Хост-порты сдвинуты, чтобы не пересекаться с vmeste/другими сервисами.
# Внутри сети compose сервисы по-прежнему на 8000/8001/5432/6379.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: base_to_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-base_to}
      POSTGRES_USER: ${POSTGRES_USER:-base_to}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-base_to_secret}
    # без ports: — только внутри docker-сети (избегаем конфликта с хостовым Postgres)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-base_to}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: base_to_redis
    # без ports: — только внутри docker-сети
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: ${IMAGE_BACKEND:-ghcr.io/for9653960484/base_to_twi-backend:latest}
    container_name: base_to_backend
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      AI_SERVICE_URL: http://ai-service:8001
      # Абсолютный путь: иначе PROJECT_ROOT в образе указывает на /,
      # файлы пишутся в /storage вне общего тома — worker их не видит.
      STORAGE_LOCAL_PATH: /app/storage
    ports:
      # 8010 снаружи: 8000 часто занят на том же VPS
      - "${API_HOST_PORT:-8010}:8000"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

  ai-service:
    image: ${IMAGE_AI:-ghcr.io/for9653960484/base_to_twi-ai:latest}
    container_name: base_to_ai
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /app/storage
      # Опционально: прокси для вызовов OpenAI (задаётся в .env на сервере)
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-postgres,redis,ai-service,backend,localhost,127.0.0.1}
    ports:
      # 8002 снаружи: 8001 занят vmeste-api
      - "${AI_HOST_PORT:-8002}:8001"
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    restart: unless-stopped

  worker:
    image: ${IMAGE_AI:-ghcr.io/for9653960484/base_to_twi-ai:latest}
    container_name: base_to_worker
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      STORAGE_LOCAL_PATH: /app/storage
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-postgres,redis,ai-service,backend,localhost,127.0.0.1}
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info
    restart: unless-stopped

  frontend:
    image: ${IMAGE_FRONTEND:-ghcr.io/for9653960484/base_to_twi-frontend:latest}
    container_name: base_to_frontend
    env_file: .env
    environment:
      # Браузер ходит на тот же origin (/api/v1), Vite проксирует в backend.
      # Иначе VITE_API_BASE_URL=http://localhost:... даёт Network Error у клиента.
      VITE_API_BASE_URL: /api/v1
      VITE_PROXY_TARGET: http://backend:8000
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5173
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
